---
- hosts: master_servers, slave_servers
  become: yes
  tasks:
    - name: 1. Disable SELinux temporarily and permanently
      ansible.builtin.shell: |
        setenforce 0 || true
        sed -i 's/^SELINUX=enforcing$/SELINUX=permissive/' /etc/selinux/config

    - name: 2. Stop and disable firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: 3. Load required kernel modules for Kubernetes
      ansible.builtin.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: 4. Ensure kernel modules load on boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: 5. Configure sysctl parameters for Kubernetes networking
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.bridge.bridge-nf-call-iptables = 1

    - name: 6. Apply sysctl parameters immediately
      ansible.builtin.command: sysctl --system

    - name: 7. Disable swap permanently
      ansible.builtin.shell: |
        swapoff -a
        sed -i '/swap/s/^/#/g' /etc/fstab

    - name: 8. Add Docker/Containerd repository
      ansible.builtin.shell: |
        dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
        dnf makecache
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: 9. Install containerd
      ansible.builtin.dnf:
        name: containerd.io
        state: present

    - name: 10. Generate default containerd config
      ansible.builtin.shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml

    - name: 11. Enable SystemdCgroup in containerd
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        line: 'SystemdCgroup = true'

    - name: 12. Enable and start containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: yes

    - name: 13. Add official Kubernetes RPM repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/v1.28/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/v1.28/rpm/repodata/repomd.xml.key
          exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni

    - name: 14. Install Kubernetes components on masters and slaves only
      ansible.builtin.dnf:
        name:
          - kubelet
          - kubeadm
          - kubectl
        disable_excludes: kubernetes
        state: present

    - name: 15. Enable kubelet service
      ansible.builtin.systemd:
        name: kubelet
        enabled: yes
